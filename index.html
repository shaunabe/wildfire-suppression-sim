const { useState, useMemo } = React;
const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, LineChart, Line, Legend, CartesianGrid } = Recharts;

// ---------- model parameters ----------
// Distances assumed for an Urban Wildlife Interface (WUI) ignition:
//   - Local fire station: 8 km from ignition point
//   - Regional air-tanker base: 80 km
//   - Drone hub (regional): 25 km
//   - Firedome installations: pre-positioned at homes (zero travel)
//
// Cost figures are rough U.S. order-of-magnitude estimates drawn from public
// procurement data, CAL FIRE / USFS reports, and manufacturer disclosures.
// They are meant for relative comparison, not budgeting.

// Each asset has TWO or THREE leasing positions and physical operating parameters.
// Wind ceiling: above this mph, asset is grounded (suppression = 0).
// Firedome has no wind ceiling — it's fixed ground infrastructure.
const ASSETS = {

      },

      },
    },
  },

    suppressionRate: 11.0,
    payloadGal: 3000,
    cycleMin: 38,
    windCeilingMph: 30,
    nightCapable: false,
    description: "Fixed-wing tankers and helitankers",

      },

      },
    },
  },
  trucks: {

    unitName: "engines + crews",
    unitHelp: "Each unit = one Type 1 or Type 3 engine with 3–4 person crew. Pumps ~500 gpm, 500 gal onboard tank. Works in any wind but reduced effectiveness above 30 mph.",
    suppressionRate: 0.85,
    pumpGpm: 500,
    tankGal: 500,
    windCeilingMph: 999,
    windPenaltyAbove: 30,
    nightCapable: true,
    description: "Ground crews with Type 1/3 engines",
    positions: {
      onSite: {
        label: "Local station (8 km)",
        travelKm: 8,
        deployMin: 9,
        seasonLease: 950_000,
        perDeployment: 5_000,
      },
      regional: {
        label: "Mutual aid (35 km)",

// Site profiles — same structure count, very different geometry.
// densityHaPerStructure = average land area per structure (lower = tighter cluster)
// emberMult = how much ember jumping helps the fire spread structure-to-structure
// fuelMult = how much surrounding wildland fuel feeds the fire base rate
const SETTINGS = {
  community: {
    label: "Residential community",
    icon: "🏘️",
    densityHaPerStructure: 0.15,
    emberMult: 1.4,
    fuelMult: 0.9,
    landValuePerHa: 50_000,        // backyards, mostly low-value brush between homes
    highValueFrac: 0.20,           // 20% of land area is "high value" (lawns/landscaping near homes)
    blurb: "Tight suburban cluster. Embers jump roof-to-roof; once one home goes, neighbors follow within minutes.",
  },
  wineFarm: {
    label: "Wine farm / vineyard",
    icon: "🍇",
    densityHaPerStructure: 8,
    emberMult: 0.4,
    fuelMult: 1.3,
    landValuePerHa: 180_000,       // producing vineyard land, plus 3-5yr replant cycle to next harvest
    highValueFrac: 0.65,           // 65% planted vines, rest is grass/woodland
    blurb: "Sparse buildings across a large estate. The vineyard rows themselves are the asset — replanting after burn means 3–5 years to first harvest.",
  },
  skiResort: {
    label: "Ski resort",
    icon: "🎿",
    densityHaPerStructure: 1.5,
    emberMult: 0.9,
    fuelMult: 1.5,
    landValuePerHa: 95_000,        // managed timber + ski run infrastructure
    highValueFrac: 0.45,           // ski runs + groomed timber zones
    blurb: "Clustered base village surrounded by conifer forest. Burned timber takes decades to recover; ski runs need restoration before reopening.",
  },
};

const WIND_LEVELS = [
  { label: "Calm (0–10 mph)",      mph: 5,  spreadMult: 1.0,  ember: 0.05 },
  { label: "Breezy (10–20 mph)",   mph: 15, spreadMult: 2.2,  ember: 0.20 },
  { label: "Strong (20–35 mph)",   mph: 28, spreadMult: 4.5,  ember: 0.45 },
  { label: "Extreme (35–60+ mph)", mph: 50, spreadMult: 9.0,  ember: 0.80 },
];

// Continuous wind profile from any mph — used by the wind-sweep chart.
// Spread multiplier and ember activity scale roughly cubically with wind.
function windAt(mph) {
  const spreadMult = 1 + Math.pow(mph / 12, 1.7);   // ≈1 at 0, ~9 at 50
  const ember = Math.min(0.9, Math.pow(mph / 55, 1.4));
  return { mph, spreadMult, ember, label: `${mph} mph` };
}

// Average travel speeds (km/min)
const SPEED = {
  firedome: 0,
  drones: 2.0,    // ~120 km/h
  aircraft: 6.7,  // ~400 km/h
  trucks: 1.0,    // ~60 km/h with terrain
};

// Average loss per hectare burned in a WUI corridor (structures + suppression damages)
// Note: actual damages are now computed per-site using SETTINGS.landValuePerHa and highValueFrac
// because flat per-hectare loss double-counted structures and ignored site differences.
const STRUCTURE_LOSS = 600_000;  // per structure

function simulate({ asset, units, windIdx, windOverride, fuelMoisture, ignitionDistanceKm, structuresAtRisk, settingKey, firedomeCoveragePct }) {
  const a = ASSETS[asset];
  const wind = windOverride || WIND_LEVELS[windIdx];
  const setting = SETTINGS[settingKey];

  // Wind ceiling: above asset's ceiling, suppression is zero (grounded).
  // Approaching the ceiling, suppression degrades smoothly — drones lose
  // precision in turbulence, aircraft fight with smoke/visibility.
  // Degradation begins at 60% of the ceiling and falls linearly to zero.
  const grounded = wind.mph > a.windCeilingMph;
  let windEffMult = 1.0;
  if (!grounded && a.windCeilingMph < 100) {
    const degradeStart = a.windCeilingMph * 0.6;
    if (wind.mph > degradeStart) {
      windEffMult = Math.max(0, 1 - (wind.mph - degradeStart) / (a.windCeilingMph - degradeStart));
    }
  }
  const groundPenalty = a.windPenaltyAbove && wind.mph > a.windPenaltyAbove
    ? Math.max(0.3, 1 - (wind.mph - a.windPenaltyAbove) / 50)
    : 1.0;

  // Iterate over ALL positions defined for this asset (handles 2 or 3 tiers).
  const tiers = Object.keys(a.positions).map(posKey => {
    const pos = a.positions[posKey];
    const u = units[posKey] || 0;
    if (u === 0) return null;

    const travelKm = pos.travelKm === 0
      ? 0
      : Math.max(0, ignitionDistanceKm * (pos.travelKm / 25));
    const speed = SPEED[asset];
    const travelMin = speed > 0 ? travelKm / speed : 0;
    const arrivalMin = travelMin + pos.deployMin;

    const effUnits = Math.pow(u, 0.85);
    // HARD wind ceiling: grounded → zero. Otherwise apply degradation curve.
    const cap = grounded ? 0 : a.suppressionRate * effUnits * groundPenalty * windEffMult;

    return {
      posKey,
      pos,
      u,
      arrivalMin,
      cap,
      grounded,
      seasonLease: pos.seasonLease * u,
      sortieCost: pos.perDeployment * u,
    };
  }).filter(Boolean);

  const totalUnits = tiers.reduce((s, t) => s + t.u, 0);
  const activeTiers = tiers.filter(t => !t.grounded && t.cap > 0);
  const earliestArrival = activeTiers.length ? Math.min(...activeTiers.map(t => t.arrivalMin)) : 999;

  // Fire growth
  const moistureFactor = 1.6 - fuelMoisture / 100;
  const spreadHaPerMin = 0.4 * wind.spreadMult * moistureFactor * setting.fuelMult;
  const effectiveEmber = wind.ember * setting.emberMult;

  // Wind-driven damage amplification (separate from fire spread):
  // At higher wind speeds, embers travel further and find more ignition points
  // per structure. IBHS research shows ignition probability roughly doubles
  // every ~15 mph above 25 mph. Captures Camp/Tubbs-style structure loss
  // intensity that a pure spread model underweights.
  // Below 15 mph: 1.0 (baseline). At 30 mph: ~1.7. At 50 mph: ~3.0. At 70 mph: ~4.5.
  const windDamageMult = wind.mph <= 15
    ? 1.0
    : 1.0 + Math.pow((wind.mph - 15) / 18, 1.4);

  // Per-structure damage severity also rises with wind: surviving structures
  // take more damage from ember intrusion, radiant heat, partial roof loss.
  // Average loss per "lost" structure goes from $600K at calm to ~$900K at extreme.
  const structureLossPerUnit = STRUCTURE_LOSS * (1 + Math.min(0.5, (wind.mph - 15) / 70));

  // Timeline — track what actually matters: high-value hectares burned and
  // structures lost over time. Wildland between high-value zones can burn
  // freely; that's not what we're measuring.
  const timeline = [];
  let burned = 0;             // total ha burned (used internally for spread dynamics)
  let active = 0;             // active fire footprint
  let structuresPerHaInZone = 1 / setting.densityHaPerStructure;
  let structuresLostT = 0;    // structures lost to date
  let suppressionEffective = false;

  for (let t = 0; t <= 240; t++) {
    let suppression = 0;
    for (const tier of tiers) {
      if (t >= tier.arrivalMin) suppression += tier.cap;
    }

    // Fire growth this minute
    if (suppression === 0) {
      burned += spreadHaPerMin;
      active = burned;
    } else {
      const newGrowth = spreadHaPerMin * (1 + effectiveEmber);
      const netChange = newGrowth - suppression;
      active = Math.max(0, active + netChange);
      if (netChange > 0) burned += netChange;
      if (active <= 0.5) suppressionEffective = true;
    }

    // High-value zone burned this tick
    const highValueBurnedT = burned * setting.highValueFrac;

    // Structures lost progressively as the active fire grows.
    // Firedome's structural protection applies regardless of suppression status.
    // Wind damage amplification scales the exposure rate independently of fire spread.
    const structuresExposed = Math.min(
      structuresAtRisk,
      active * structuresPerHaInZone * 0.4 * (1 + effectiveEmber) * windDamageMult
    );
    let structuresLostNow = structuresExposed;
    if (asset === "firedome" && firedomeCoveragePct !== undefined) {
      structuresLostNow *= (1 - (firedomeCoveragePct / 100) * 0.92);
    }
    structuresLostT = Math.max(structuresLostT, structuresLostNow);

    timeline.push({
      t,
      highValueBurned: Math.round(highValueBurnedT * 10) / 10,
      structuresLost: Math.round(structuresLostT),
      valueLost: Math.round(highValueBurnedT * setting.landValuePerHa + structuresLostT * structureLossPerUnit),
    });
  }

  const finalHighValueBurned = burned * setting.highValueFrac;
  let structuresLost = Math.round(structuresLostT);

  // Costs — seasonal lease replaces capex+opex for this season
  const seasonLease = tiers.reduce((s, t) => s + t.seasonLease, 0);
  const sortieCost = tiers.reduce((s, t) => s + t.sortieCost, 0);
  // Damages: only high-value land + structures count. Wildland between/around
  // them is acknowledged-but-not-monetized. Per-structure cost rises with wind.
  const highValueHaBurned = finalHighValueBurned;
  const landDamages = highValueHaBurned * setting.landValuePerHa;
  const structureDamages = structuresLost * structureLossPerUnit;
  const damages = landDamages + structureDamages;
  const totalSeasonCost = seasonLease + sortieCost + damages;

  return {
    timeline,
    arrivalMin: Math.round(earliestArrival * 10) / 10,
    highValueHaBurned: Math.round(highValueHaBurned * 10) / 10,
    structuresLost,
    landDamages,
    structureDamages,
    seasonLease,
    sortieCost,
    damages,
    totalSeasonCost,
    totalUnits,
    tiers,
  };
}

};

const Slider = ({ label, value, min, max, step, onChange, suffix, help }) => {

};

// Density map — dot-pattern visualization of how the same structure count
// lays out across different setting types. Same structures, different geometry.
const DensityMap = ({ settingKey, structures }) => {
  const setting = SETTINGS[settingKey];
  const W = 320, H = 180;

  // Generate dot positions deterministically based on setting profile.
  // We use a seeded pseudo-random so dots stay put across renders.
  const dots = useMemo(() => {
    const seed = settingKey.length * 17;
    let s = seed;
    const rand = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cap = Math.min(structures, 200); // visual cap
    const out = [];

    if (settingKey === "community") {
      // Tight grid with small jitter
      const cols = Math.ceil(Math.sqrt(cap * (W / H)));
      const rows = Math.ceil(cap / cols);
      const gx = (W - 30) / cols;
      const gy = (H - 30) / rows;
      for (let i = 0; i < cap; i++) {
        const c = i % cols, r = Math.floor(i / cols);
        out.push({
          x: 15 + c * gx + (rand() - 0.5) * 4,
          y: 15 + r * gy + (rand() - 0.5) * 4,
        });
      }
    } else if (settingKey === "wineFarm") {
      // Few buildings clustered top-left; rest is "vineyard" rendered as rows
      const buildings = Math.min(cap, Math.max(3, Math.round(cap * 0.05)));
      for (let i = 0; i < buildings; i++) {
        out.push({ x: 30 + (i % 3) * 14 + rand() * 3, y: 30 + Math.floor(i / 3) * 14 + rand() * 3, big: true });
      }
    } else if (settingKey === "skiResort") {
      // Cluster at base + scattered lift-line huts radiating up
      const base = Math.min(cap, Math.max(8, Math.round(cap * 0.6)));
      for (let i = 0; i < base; i++) {
        out.push({
          x: W * 0.25 + (rand() - 0.5) * 50,
          y: H * 0.75 + (rand() - 0.5) * 30,
        });
      }
      // Scattered along ridges
      for (let i = 0; i < cap - base; i++) {
        out.push({
          x: W * 0.45 + rand() * (W * 0.5),
          y: H * 0.15 + rand() * (H * 0.5),
        });
      }
    }
    return out;
  }, [settingKey, structures]);

  // Background fills depending on setting
  const bg = {
    community: "#E1F5EE",
    wineFarm: "#EAF3DE",
    skiResort: "#E6F1FB",
  }[settingKey];

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: "block", borderRadius: 6 }}>
      <rect x="0" y="0" width={W} height={H} fill={bg} />

      {/* Setting-specific terrain features */}
      {settingKey === "wineFarm" && (
        <g opacity="0.5">
          {Array.from({ length: 14 }).map((_, i) => (
            <line key={i} x1={i * 25 + 20} y1={70} x2={i * 25 + 20} y2={H - 5}
                  stroke="#97C459" strokeWidth="1.5" />
          ))}
        </g>
      )}
      {settingKey === "skiResort" && (
        <g opacity="0.6">
          {/* Conifer triangles scattered */}
          {Array.from({ length: 30 }).map((_, i) => {
            const x = (i * 53) % W;
            const y = (i * 31) % (H - 20);
            return <polygon key={i} points={`${x},${y+8} ${x-4},${y+14} ${x+4},${y+14}`} fill="#3B6D11" />;
          })}
          {/* Lift line */}
          <line x1={W*0.25} y1={H*0.75} x2={W*0.85} y2={H*0.15}
                stroke="#888780" strokeWidth="0.8" strokeDasharray="3 2" />
        </g>
      )}

      {/* Structures */}
      {dots.map((d, i) => (
        <rect key={i}
              x={d.x - (d.big ? 4 : 2)}
              y={d.y - (d.big ? 4 : 2)}
              width={d.big ? 8 : 4}
              height={d.big ? 8 : 4}
              fill={d.big ? "#5F5E5A" : "#444441"}
              rx="1" />
      ))}

      {/* Scale bar */}
      <g transform={`translate(${W - 75}, ${H - 14})`}>
        <line x1="0" y1="0" x2="60" y2="0" stroke="#444441" strokeWidth="1" />
        <line x1="0" y1="-3" x2="0" y2="3" stroke="#444441" strokeWidth="1" />
        <line x1="60" y1="-3" x2="60" y2="3" stroke="#444441" strokeWidth="1" />
        <text x="30" y="-5" fontSize="9" fill="#444441" textAnchor="middle">
          {settingKey === "community" ? "200 m" : settingKey === "wineFarm" ? "1.5 km" : "800 m"}
        </text>
      </g>
    </svg>
  );
};

const Stat = ({ label, value, sub, color }) => (
  <div style={{ background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)", padding: "12px 14px" }}>
    <div style={{ fontSize: 12, color: "var(--color-text-secondary)" }}>{label}</div>
    <div style={{ fontSize: 20, fontWeight: 500, color: color || "var(--color-text-primary)", marginTop: 2 }}>{value}</div>
    {sub && <div style={{ fontSize: 11, color: "var(--color-text-tertiary)", marginTop: 2 }}>{sub}</div>}
  </div>
);


function FirefightingSim() {
  const [units, setUnits] = useState({
    firedome: { onSiteCoveragePct: 80, regional: 0 },  // % of structures covered + count of mobile units
    drones:   { onSite: 2,  truckMounted: 0, regional: 4 },
    aircraft: { onSite: 0,  regional: 2 },
    trucks:   { onSite: 3,  regional: 4 },
  });
  const [windIdx, setWindIdx] = useState(1);
  const [fuelMoisture, setFuelMoisture] = useState(35);
  const [ignitionDist, setIgnitionDist] = useState(25);
  const [structuresAtRisk, setStructuresAtRisk] = useState(120);
  const [settingKey, setSettingKey] = useState("community");
  const [view, setView] = useState("valueLost");

  const setUnit = (asset, posKey, val) => {
    setUnits(u => ({ ...u, [asset]: { ...u[asset], [posKey]: val } }));
  };

  // Helper: Firedome's user input is "coverage %" — resolve that to a
  // real unit count given the site density and structures at risk.
  const firedomeUnitsNeeded = useMemo(() => {
    const setting = SETTINGS[settingKey];
    const coverageHa = ASSETS.firedome.coverageHa;             // ~29 ha per unit
    const structuresPerUnit = coverageHa / setting.densityHaPerStructure;
    const pct = units.firedome.onSiteCoveragePct / 100;
    const structsToCover = structuresAtRisk * pct;
    return Math.ceil(structsToCover / structuresPerUnit);
  }, [units.firedome.onSiteCoveragePct, settingKey, structuresAtRisk]);

  const results = useMemo(() => {
    const out = {};
    for (const key of Object.keys(ASSETS)) {
      // For Firedome, replace the coverage% input with the resolved unit count.
      const resolvedUnits = key === "firedome"
        ? { onSite: firedomeUnitsNeeded, regional: units.firedome.regional }
        : units[key];
      out[key] = simulate({
        asset: key,
        units: resolvedUnits,
        windIdx,
        fuelMoisture,
        ignitionDistanceKm: ignitionDist,
        structuresAtRisk,
        settingKey,
        firedomeCoveragePct: key === "firedome" ? units.firedome.onSiteCoveragePct : undefined,
      });
    }
    return out;
  }, [units, firedomeUnitsNeeded, windIdx, fuelMoisture, ignitionDist, structuresAtRisk, settingKey]);

  // Combine timelines for chart
  const chartData = useMemo(() => {
    const points = [];
    for (let t = 0; t <= 240; t += 5) {
      const row = { t };
      for (const key of Object.keys(ASSETS)) {
        row[key] = results[key].timeline[t][view];
      }
      points.push(row);
    }
    return points;
  }, [results, view]);

  const fmt = n => {
    if (n >= 1_000_000_000) return `$${(n/1_000_000_000).toFixed(2)}B`;
    if (n >= 1_000_000) return `$${(n/1_000_000).toFixed(1)}M`;
    if (n >= 1_000) return `$${(n/1_000).toFixed(0)}K`;
    return `$${Math.round(n)}`;
  };

  // Wind sweep — re-run simulate at every wind speed from 0 to 60 mph in 2 mph steps
  // to surface where each asset's cost curve breaks.
  const windSweep = useMemo(() => {
    const points = [];
    for (let mph = 0; mph <= 60; mph += 2) {
      const wind = windAt(mph);
      const row = { mph };
      for (const key of Object.keys(ASSETS)) {
        const resolvedUnits = key === "firedome"
          ? { onSite: firedomeUnitsNeeded, regional: units.firedome.regional }
          : units[key];
        const r = simulate({
          asset: key,
          units: resolvedUnits,
          windOverride: wind,
          fuelMoisture,
          ignitionDistanceKm: ignitionDist,
          structuresAtRisk,
          settingKey,
          firedomeCoveragePct: key === "firedome" ? units.firedome.onSiteCoveragePct : undefined,
        });
        row[key] = Math.round(r.totalSeasonCost / 100_000) * 100_000;  // round for cleaner chart
      }
      points.push(row);
    }
    return points;
  }, [units, firedomeUnitsNeeded, fuelMoisture, ignitionDist, structuresAtRisk, settingKey]);

  // Side-by-side: same config, calm vs extreme wind
  const calmVsExtreme = useMemo(() => {
    const out = {};
    for (const key of Object.keys(ASSETS)) {
      const resolvedUnits = key === "firedome"
        ? { onSite: firedomeUnitsNeeded, regional: units.firedome.regional }
        : units[key];
      const baseArgs = {
        asset: key, units: resolvedUnits, fuelMoisture,
        ignitionDistanceKm: ignitionDist, structuresAtRisk, settingKey,
        firedomeCoveragePct: key === "firedome" ? units.firedome.onSiteCoveragePct : undefined,
      };
      out[key] = {
        calm:    simulate({ ...baseArgs, windOverride: windAt(5) }),
        extreme: simulate({ ...baseArgs, windOverride: windAt(50) }),
      };
    }
    return out;
  }, [units, firedomeUnitsNeeded, fuelMoisture, ignitionDist, structuresAtRisk, settingKey]);

  // Combinations: each wildland-suppression asset, with and without Firedome layered on top.
  // Firedome's value is purely structural protection — it reduces structure loss and adds
  // its season-lease cost. Doesn't change hectares burned or containment time.
  const combinations = useMemo(() => {
    const out = {};
    const fdCoverage = units.firedome.onSiteCoveragePct;
    const fdCoverFrac = fdCoverage / 100;
    const fdLease = ASSETS.firedome.positions.onSite.seasonLease * firedomeUnitsNeeded;

    // Wind-adjusted per-structure cost (matches simulate())
    const currentWindMph = WIND_LEVELS[windIdx].mph;
    const perStructCost = STRUCTURE_LOSS * (1 + Math.min(0.5, (currentWindMph - 15) / 70));

    for (const key of Object.keys(ASSETS)) {
      if (key === "firedome") continue;
      const r = results[key];
      // "With Firedome" applies the structural protection multiplier to structures lost,
      // adds Firedome's lease cost, and re-derives damages.
      const protectedStructures = Math.round(r.structuresLost * (1 - fdCoverFrac * 0.92));
      const adjustedStructureDmg = protectedStructures * perStructCost;
      const adjustedDamages = r.landDamages + adjustedStructureDmg;
      const withFiredome = {
        structuresLost: protectedStructures,
        damages: adjustedDamages,
        seasonLease: r.seasonLease + fdLease,
        sortieCost: r.sortieCost,
        totalSeasonCost: r.seasonLease + fdLease + r.sortieCost + adjustedDamages,
      };
      out[key] = {
        alone: {
          structuresLost: r.structuresLost,
          damages: r.damages,
          seasonLease: r.seasonLease,
          sortieCost: r.sortieCost,
          totalSeasonCost: r.totalSeasonCost,
        },
        withFiredome,
        delta: r.totalSeasonCost - withFiredome.totalSeasonCost,  // positive = Firedome saves money
      };
    }
    return out;
  }, [results, units.firedome.onSiteCoveragePct, firedomeUnitsNeeded]);

  return (
    <div style={{ fontFamily: "var(--font-sans)", color: "var(--color-text-primary)", padding: "16px 4px", maxWidth: 1100, margin: "0 auto" }}>
      <h1 style={{ fontSize: 22, fontWeight: 500, margin: "0 0 4px" }}>Protecting structures and high-value land at the wildland–urban interface</h1>
      <p style={{ fontSize: 14, color: "var(--color-text-secondary)", margin: "0 0 20px" }}>
        Wildland between high-value zones is allowed to burn — that's how forests stay healthy. The question is what gets through to the structures and the assets that matter. Compare four suppression strategies and a structural protection layer.
      </p>

      <div style={{ display: "grid", gridTemplateColumns: "320px minmax(0, 1fr)", gap: 20, alignItems: "start" }}>
        {/* Controls */}
        <div style={{ background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-lg)", padding: "16px 16px 4px" }}>
          <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 8px", color: "var(--color-text-secondary)", textTransform: "uppercase", letterSpacing: 0.5 }}>Site profile</h3>

          <div style={{ display: "flex", gap: 4, marginBottom: 10 }}>
            {Object.entries(SETTINGS).map(([k, s]) => (
              <button key={k}
                      onClick={() => setSettingKey(k)}
                      style={{
                        flex: 1,
                        background: settingKey === k ? "var(--color-background-primary)" : "transparent",
                        border: settingKey === k ? "0.5px solid var(--color-border-secondary)" : "0.5px solid transparent",
                        fontSize: 11,
                        padding: "6px 4px",
                        textAlign: "center",
                      }}>
                <div style={{ fontSize: 16 }}>{s.icon}</div>
                <div style={{ marginTop: 2, fontWeight: settingKey === k ? 500 : 400 }}>
                  {s.label.split(" ")[0]}
                </div>
              </button>
            ))}
          </div>

          <DensityMap settingKey={settingKey} structures={structuresAtRisk} />

          <p style={{ fontSize: 11, color: "var(--color-text-secondary)", lineHeight: 1.45, margin: "8px 0 16px" }}>
            {SETTINGS[settingKey].blurb}
          </p>

          <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 12px", color: "var(--color-text-secondary)", textTransform: "uppercase", letterSpacing: 0.5 }}>Conditions</h3>

          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 13, color: "var(--color-text-secondary)", marginBottom: 6 }}>Wind condition</div>
            <select value={windIdx} onChange={e => setWindIdx(Number(e.target.value))}
                    style={{ width: "100%" }}>
              {WIND_LEVELS.map((w, i) => <option key={i} value={i}>{w.label}</option>)}
            </select>
            {(() => {
              const w = WIND_LEVELS[windIdx];
              const wdm = w.mph <= 15 ? 1.0 : 1.0 + Math.pow((w.mph - 15) / 18, 1.4);
              const slu = 1 + Math.min(0.5, (w.mph - 15) / 70);
              return (
                <div style={{ fontSize: 10, color: "var(--color-text-tertiary)", marginTop: 6, lineHeight: 1.45, padding: "6px 8px", background: "var(--color-background-primary)", borderRadius: 4 }}>
                  At {w.mph} mph: spread <b style={{ color: "var(--color-text-secondary)" }}>{w.spreadMult.toFixed(1)}×</b> · ember activity <b style={{ color: "var(--color-text-secondary)" }}>{(w.ember * 100).toFixed(0)}%</b> · structure exposure <b style={{ color: "var(--color-text-secondary)" }}>{wdm.toFixed(1)}×</b> · per-structure damage <b style={{ color: "var(--color-text-secondary)" }}>{slu.toFixed(2)}×</b>
                </div>
              );
            })()}
          </div>

          <Slider label="Fuel moisture" value={fuelMoisture} min={5} max={80} step={1} onChange={setFuelMoisture} suffix="%"
                  help="Moisture content of the wildland fuel. Below 15% is critical fire weather; above 60% the fuel is hard to ignite." />
          <Slider label="Ignition distance from staging" value={ignitionDist} min={5} max={80} step={1} onChange={setIgnitionDist} suffix=" km"
                  help="How far the ignition is from the nearest dispatch hub. Scales travel time for drones, aircraft, and engines. Firedome is unaffected (already on site)." />
          <Slider label="Structures at risk" value={structuresAtRisk} min={10} max={500} step={10} onChange={setStructuresAtRisk} suffix=""
                  help="Total number of structures in the threatened zone. Caps the maximum structure-loss number." />

          <h3 style={{ fontSize: 14, fontWeight: 500, margin: "20px 0 4px", color: "var(--color-text-secondary)", textTransform: "uppercase", letterSpacing: 0.5 }}>Seasonal lease — resources</h3>
          <p style={{ fontSize: 11, color: "var(--color-text-tertiary)", lineHeight: 1.45, margin: "0 0 12px" }}>
            Each asset can be leased seasonally across multiple positions: <span style={{ fontWeight: 500 }}>on-site</span> (fast, expensive), <span style={{ fontWeight: 500 }}>regional</span> (slower, cheaper), or in some cases truck-mounted. Mix and match.
          </p>
          {Object.entries(ASSETS).map(([key, a]) => {
            const maxByPos = key === "firedome"
              ? { regional: 50 }
              : key === "trucks" ? { onSite: 15, regional: 20 }
              : key === "drones" ? { onSite: 20, truckMounted: 30, regional: 30 }
              : { onSite: 6, regional: 10 };
            return (
              <div key={key} style={{
                background: "var(--color-background-primary)",
                border: "0.5px solid var(--color-border-tertiary)",
                borderRadius: "var(--border-radius-md)",
                padding: "10px 12px",
                marginBottom: 10,
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8, fontSize: 13, fontWeight: 500 }}>
                  <span style={{ fontSize: 15 }}>{a.icon}</span>
                  <span>{a.label}</span>
                  <HelpDot help={a.unitHelp} />
                </div>
                {Object.entries(a.positions).map(([posKey, pos]) => {
                  // Special case: Firedome on-site is a coverage % slider
                  if (key === "firedome" && posKey === "onSite") {
                    const pct = units.firedome.onSiteCoveragePct;
                    const totalLease = pos.seasonLease * firedomeUnitsNeeded;
                    const structsCovered = Math.round(structuresAtRisk * pct / 100);
                    return (
                      <div key={posKey} style={{ marginBottom: 6 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, marginBottom: 3 }}>
                          <span style={{ color: "var(--color-text-secondary)" }}>
                            {pos.label}
                            <span style={{ color: "var(--color-text-tertiary)", marginLeft: 4 }}>
                              · {fmt(pos.seasonLease)}/unit/season
                            </span>
                          </span>
                          <span style={{ fontWeight: 500 }}>{pct}%</span>
                        </div>
                        <input type="range" min={0} max={100} step={5}
                               value={pct}
                               onChange={e => setUnit("firedome", "onSiteCoveragePct", Number(e.target.value))}
                               style={{ width: "100%" }} />
                        <div style={{ fontSize: 10, color: "var(--color-text-tertiary)", marginTop: 3 }}>
                          {firedomeUnitsNeeded} unit{firedomeUnitsNeeded === 1 ? "" : "s"} needed · covers ~{structsCovered} structures · {fmt(totalLease)}/season
                        </div>
                      </div>
                    );
                  }
                  // Generic count slider
                  return (
                    <div key={posKey} style={{ marginBottom: 6 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, marginBottom: 3 }}>
                        <span style={{ color: "var(--color-text-secondary)" }}>
                          {pos.label}
                          <span style={{ color: "var(--color-text-tertiary)", marginLeft: 4 }}>
                            · {fmt(pos.seasonLease)}/season
                          </span>
                        </span>
                        <span style={{ fontWeight: 500 }}>{units[key][posKey]}</span>
                      </div>
                      <input type="range" min={0} max={maxByPos[posKey]} step={1}
                             value={units[key][posKey]}
                             onChange={e => setUnit(key, posKey, Number(e.target.value))}
                             style={{ width: "100%" }} />
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>

        {/* Right column */}
        <div>
          {(() => {
            const wind = WIND_LEVELS[windIdx];
            const groundedAssets = Object.entries(ASSETS).filter(([k, a]) => k !== "firedome" && wind.mph > a.windCeilingMph);
            const wildlandAssetCount = Object.keys(ASSETS).length - 1;  // exclude firedome
            const allGrounded = groundedAssets.length === wildlandAssetCount;
            const someGrounded = groundedAssets.length > 0;
            if (!someGrounded) return null;
            return (
              <div style={{
                background: allGrounded ? "#FCEBEB" : "#FAEEDA",
                border: `0.5px solid ${allGrounded ? "#F09595" : "#FAC775"}`,
                borderRadius: "var(--border-radius-md)",
                padding: "10px 14px",
                marginBottom: 12,
                fontSize: 12,
                lineHeight: 1.5,
                color: allGrounded ? "#501313" : "#412402",
              }}>
                <div style={{ fontWeight: 500, fontSize: 13, marginBottom: 2 }}>
                  {allGrounded
                    ? `All wildland-suppression assets grounded at ${wind.mph} mph wind`
                    : `${groundedAssets.map(([k, a]) => a.label).join(" and ")} grounded at ${wind.mph} mph`}
                </div>
                {allGrounded
                  ? "No fixed-wing or rotor-based suppression is operating. The only working defenses are Firedome (structural protection) and ground crews. The 'season total' figures below reflect lease costs paid for capability that cannot be deployed in these conditions — see the combinations panel below for realistic deployment options."
                  : "These assets keep paying their lease but contribute zero suppression in this wind. Their cost figures below reflect that gap."}
              </div>
            );
          })()}
          {/* Stat cards per asset */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, minmax(0, 1fr))", gap: 10, marginBottom: 16 }}>
            {Object.entries(ASSETS).map(([key, a]) => {
              const r = results[key];
              const wind = WIND_LEVELS[windIdx];
              const isGrounded = wind.mph > a.windCeilingMph;

              // Specs line per asset
              let specs;
              if (key === "firedome") specs = `${a.rangeM}m radius · ${a.payloadGal} gal/${a.cycleS}s · no wind ceiling`;
              else if (key === "drones") specs = `${a.payloadL}L payload · ${a.cycleMin}min cycle · ${a.windCeilingMph}mph ceiling`;
              else if (key === "aircraft") specs = `${a.payloadGal.toLocaleString()} gal/drop · ${a.cycleMin}min cycle · ${a.windCeilingMph}mph ceiling`;
              else specs = `${a.pumpGpm} gpm pump · ${a.tankGal} gal tank`;

              // Deployed-units summary line
              let deployedLine;
              if (key === "firedome") {
                deployedLine = `${units.firedome.onSiteCoveragePct}% coverage · ${firedomeUnitsNeeded} unit${firedomeUnitsNeeded === 1 ? "" : "s"}`;
              } else {
                const total = Object.values(units[key]).reduce((s, n) => s + n, 0);
                deployedLine = `${total} ${a.unitName} deployed`;
              }

              return (
                <div key={key} style={{
                  background: "var(--color-background-primary)",
                  border: "0.5px solid var(--color-border-tertiary)",
                  borderRadius: "var(--border-radius-lg)",
                  padding: "12px 14px",
                  position: "relative",
                  opacity: isGrounded ? 0.65 : 1,
                }}>
                  {isGrounded && (
                    <div style={{ position: "absolute", top: -10, right: 10, background: "#A32D2D", color: "white", fontSize: 10, padding: "2px 8px", borderRadius: 4, fontWeight: 500 }}>
                      Grounded · wind &gt; {a.windCeilingMph}mph
                    </div>
                  )}
                  <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 2, display: "flex", alignItems: "center", gap: 6 }}>
                    <span style={{ fontSize: 16 }}>{a.icon}</span>
                    <span>{a.label}</span>
                  </div>
                  <div style={{ fontSize: 10, color: "var(--color-text-tertiary)", marginBottom: 6, lineHeight: 1.35 }}>
                    {specs}
                  </div>
                  <div style={{ fontSize: 11, color: "var(--color-text-secondary)", fontWeight: 500, marginBottom: 8, padding: "3px 6px", background: "var(--color-background-secondary)", borderRadius: 4, display: "inline-block" }}>
                    {deployedLine}
                  </div>
                  <div style={{ display: "grid", gap: 6, fontSize: 12 }}>
                    <div style={{ display: "flex", justifyContent: "space-between" }}>
                      <span style={{ color: "var(--color-text-secondary)" }}>High-value burned</span>
                      <span style={{ fontWeight: 500 }}>{r.highValueHaBurned} ha</span>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between" }}>
                      <span style={{ color: "var(--color-text-secondary)" }}>Structures lost</span>
                      <span style={{ fontWeight: 500, color: r.structuresLost === 0 ? "#0F6E56" : r.structuresLost > structuresAtRisk * 0.5 ? "#A32D2D" : "var(--color-text-primary)" }}>
                        {r.structuresLost} / {structuresAtRisk}
                      </span>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between" }}>
                      <span style={{ color: "var(--color-text-secondary)" }}>Damages</span>
                      <span style={{ fontWeight: 500 }}>{fmt(r.damages)}</span>
                    </div>
                    <div style={{ borderTop: "0.5px solid var(--color-border-tertiary)", marginTop: 4, paddingTop: 6, display: "flex", justifyContent: "space-between" }}>
                      <span style={{ color: "var(--color-text-secondary)" }}>Season total</span>
                      <span style={{ fontWeight: 500, color: a.color }}>{fmt(r.totalSeasonCost)}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Chart */}
          <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "12px 14px 8px", marginBottom: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 500 }}>
                {view === "valueLost" ? "$ value at risk" : view === "structuresLost" ? "Structures lost" : "High-value land burned"} over time
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={() => setView("highValueBurned")}
                        style={{ background: view === "highValueBurned" ? "var(--color-background-secondary)" : "transparent", fontSize: 12, padding: "4px 10px" }}>
                  High-value land
                </button>
                <button onClick={() => setView("structuresLost")}
                        style={{ background: view === "structuresLost" ? "var(--color-background-secondary)" : "transparent", fontSize: 12, padding: "4px 10px" }}>
                  Structures lost
                </button>
                <button onClick={() => setView("valueLost")}
                        style={{ background: view === "valueLost" ? "var(--color-background-secondary)" : "transparent", fontSize: 12, padding: "4px 10px" }}>
                  $ at risk
                </button>
              </div>
            </div>
            <div style={{ height: 240 }}>
              <ResponsiveContainer width="100%" height="100%">
                <LineChart data={chartData} margin={{ top: 5, right: 12, bottom: 18, left: 0 }}>
                  <CartesianGrid stroke="var(--color-border-tertiary)" strokeDasharray="2 4" />
                  <XAxis dataKey="t" tick={{ fontSize: 11 }} label={{ value: "minutes since ignition", position: "insideBottom", offset: -8, fontSize: 11 }} />
                  <YAxis tick={{ fontSize: 11 }}
                         tickFormatter={view === "valueLost" ? fmt : undefined}
                         label={{
                           value: view === "valueLost" ? "$ value" : view === "structuresLost" ? "structures" : "hectares",
                           angle: -90, position: "insideLeft", fontSize: 11
                         }} />
                  <Tooltip contentStyle={{ fontSize: 12, borderRadius: 8 }}
                           formatter={view === "valueLost" ? fmt : undefined} />
                  <Legend wrapperStyle={{ fontSize: 12 }} />
                  {/* On structures and $ views, include Firedome — its protection effect shows here */}
                  {Object.entries(ASSETS)
                    .filter(([k]) => view === "highValueBurned" ? k !== "firedome" : true)
                    .map(([key, a]) => (
                      <Line key={key} type="monotone" dataKey={key} name={a.label} stroke={a.color} strokeWidth={2} dot={false} />
                    ))}
                </LineChart>
              </ResponsiveContainer>
            </div>
            <div style={{ fontSize: 11, color: "var(--color-text-tertiary)", marginTop: 4, lineHeight: 1.4 }}>
              {view === "highValueBurned" && `High-value land burned only — ${Math.round(SETTINGS[settingKey].highValueFrac * 100)}% of footprint at this site (${SETTINGS[settingKey].label.toLowerCase()}). Wildland between high-value zones is allowed to burn. Firedome excluded — it doesn't suppress wildland fire.`}
              {view === "structuresLost" && `Structures progressively lost as the active fire grows. Firedome's structural protection holds losses down regardless of suppression status.`}
              {view === "valueLost" && `Combined dollar value of high-value land burned + structures lost over time. Wildland between zones isn't counted.`}
            </div>
          </div>

          {/* Cost breakdown */}
          <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "12px 14px" }}>
            <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 8 }}>Season cost stack — leases + sorties + damages</div>
            <div style={{ height: 220 }}>
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={Object.entries(ASSETS).map(([key, a]) => {
                  const r = results[key];
                  const onSiteLease = (r.tiers.find(t => t.posKey === "onSite")?.seasonLease) || 0;
                  const regionalLease = (r.tiers.find(t => t.posKey === "regional")?.seasonLease) || 0;
                  return {
                    name: a.label,
                    "On-site lease": onSiteLease,
                    "Regional lease": regionalLease,
                    "Sortie cost": r.sortieCost,
                    "Land value lost": r.landDamages,
                    "Structures lost": r.structureDamages,
                  };
                })} margin={{ top: 5, right: 12, bottom: 5, left: 0 }}>
                  <CartesianGrid stroke="var(--color-border-tertiary)" strokeDasharray="2 4" />
                  <XAxis dataKey="name" tick={{ fontSize: 11 }} />
                  <YAxis tick={{ fontSize: 11 }} tickFormatter={fmt} />
                  <Tooltip formatter={fmt} contentStyle={{ fontSize: 12, borderRadius: 8 }} />
                  <Legend wrapperStyle={{ fontSize: 12 }} />
                  <Bar dataKey="On-site lease" stackId="a" fill="#7F77DD" />
                  <Bar dataKey="Regional lease" stackId="a" fill="#AFA9EC" />
                  <Bar dataKey="Sortie cost" stackId="a" fill="#BA7517" />
                  <Bar dataKey="Land value lost" stackId="a" fill="#F09995" />
                  <Bar dataKey="Structures lost" stackId="a" fill="#D85A30" />
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>

          {/* High-wind partnership callout */}
          <div style={{
            background: "#FCEBEB",
            border: "0.5px solid #F09595",
            borderRadius: "var(--border-radius-lg)",
            padding: "12px 16px",
            marginTop: 16,
            display: "flex",
            gap: 16,
            alignItems: "center",
          }}>
            <div style={{ fontSize: 24 }}>⚠️</div>
            <div style={{ flex: 1, fontSize: 12, color: "#501313", lineHeight: 1.5 }}>
              <div style={{ fontWeight: 500, fontSize: 13, marginBottom: 2 }}>
                Above 30 mph wind, only Firedome and ground crews work
              </div>
              Aircraft and drones are grounded — their season lease is paid in full but they contribute zero suppression. The defensive line is reduced to fixed perimeter systems plus engines, which is exactly when most catastrophic WUI events happen (Camp, Tubbs, Marshall, Lahaina, Eaton, Palisades).
            </div>
          </div>

          {/* Calm vs Extreme side-by-side */}
          <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "12px 14px", marginTop: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 10 }}>Same config under calm vs extreme wind</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0, 1fr))", gap: 10 }}>
              {Object.entries(ASSETS).filter(([k]) => k !== "firedome").map(([key, a]) => {
                const cve = calmVsExtreme[key];
                const calmCost = cve.calm.totalSeasonCost;
                const extremeCost = cve.extreme.totalSeasonCost;
                const delta = extremeCost - calmCost;
                const ratio = calmCost > 0 ? extremeCost / calmCost : 1;
                return (
                  <div key={key} style={{ background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)", padding: "10px 12px" }}>
                    <div style={{ fontSize: 12, fontWeight: 500, marginBottom: 6, display: "flex", alignItems: "center", gap: 4 }}>
                      <span>{a.icon}</span><span>{a.label}</span>
                    </div>
                    <div style={{ fontSize: 10, color: "var(--color-text-secondary)" }}>5 mph</div>
                    <div style={{ fontSize: 14, fontWeight: 500 }}>{fmt(calmCost)}</div>
                    <div style={{ fontSize: 10, color: "var(--color-text-secondary)", marginTop: 6 }}>50 mph</div>
                    <div style={{ fontSize: 14, fontWeight: 500, color: a.windCeilingMph < 50 ? "#A32D2D" : a.color }}>
                      {fmt(extremeCost)}
                    </div>
                    <div style={{ fontSize: 10, color: "var(--color-text-tertiary)", marginTop: 4 }}>
                      {ratio >= 100 ? "→ ∞×" : ratio >= 2 ? `→ ${ratio.toFixed(1)}× cost` : `→ +${fmt(delta)}`}
                    </div>
                    <div style={{ fontSize: 10, marginTop: 4, color: cve.extreme.structuresLost > cve.calm.structuresLost * 3 ? "#A32D2D" : "var(--color-text-secondary)" }}>
                      {cve.calm.structuresLost} → {cve.extreme.structuresLost} structures lost
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Wind sweep chart */}
          <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "12px 14px", marginTop: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 4 }}>Total season cost vs wind speed</div>
            <div style={{ fontSize: 11, color: "var(--color-text-secondary)", marginBottom: 8 }}>
              Holding all other variables constant. Watch what happens at the 30 mph threshold.
            </div>
            <div style={{ height: 280 }}>
              <ResponsiveContainer width="100%" height="100%">
                <LineChart data={windSweep} margin={{ top: 5, right: 12, bottom: 22, left: 0 }}>
                  <CartesianGrid stroke="var(--color-border-tertiary)" strokeDasharray="2 4" />
                  <XAxis dataKey="mph" tick={{ fontSize: 11 }}
                         label={{ value: "wind speed (mph)", position: "insideBottom", offset: -10, fontSize: 11 }} />
                  <YAxis tick={{ fontSize: 11 }} tickFormatter={fmt}
                         label={{ value: "season cost", angle: -90, position: "insideLeft", fontSize: 11 }} />
                  <Tooltip formatter={fmt} contentStyle={{ fontSize: 12, borderRadius: 8 }}
                           labelFormatter={mph => `${mph} mph`} />
                  <Legend wrapperStyle={{ fontSize: 12 }} />
                  {/* Vertical reference line at 30 mph wind ceiling */}
                  {Object.entries(ASSETS).map(([key, a]) => (
                    <Line key={key} type="monotone" dataKey={key} name={a.label}
                          stroke={a.color} strokeWidth={2} dot={false} />
                  ))}
                </LineChart>
              </ResponsiveContainer>
            </div>
            <div style={{ fontSize: 11, color: "var(--color-text-tertiary)", marginTop: 6, lineHeight: 1.5 }}>
              Drone and aircraft cost curves jump at ~30 mph because they're grounded — they keep paying the lease but stop contributing suppression, so damages dominate. Firedome stays nearly flat: it doesn't fight the fire, it protects what's inside its radius. Trucks degrade gradually but never go to zero.
            </div>
          </div>

          {/* Combinations — Firedome as a structural protection layer added to other assets */}
          <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "12px 14px", marginTop: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 4 }}>Firedome as a structural protection layer</div>
            <div style={{ fontSize: 11, color: "var(--color-text-secondary)", marginBottom: 10, lineHeight: 1.5 }}>
              Firedome doesn't fight wildland fire — it protects structures within its coverage radius. The realistic question is whether to layer it on top of another suppression strategy. Each row shows the asset alone vs the asset + Firedome at your current {units.firedome.onSiteCoveragePct}% coverage ({fmt(ASSETS.firedome.positions.onSite.seasonLease * firedomeUnitsNeeded)} added).
            </div>
            <table style={{ width: "100%", fontSize: 12, borderCollapse: "collapse" }}>
              <thead>
                <tr style={{ borderBottom: "0.5px solid var(--color-border-tertiary)", color: "var(--color-text-secondary)", fontWeight: 400 }}>
                  <th style={{ textAlign: "left", padding: "6px 4px" }}>Strategy</th>
                  <th style={{ textAlign: "right", padding: "6px 4px" }}>Structures lost</th>
                  <th style={{ textAlign: "right", padding: "6px 4px" }}>Damages</th>
                  <th style={{ textAlign: "right", padding: "6px 4px" }}>Season total</th>
                  <th style={{ textAlign: "right", padding: "6px 4px" }}>Δ vs alone</th>
                </tr>
              </thead>
                {Object.entries(combinations).map(([key, c]) => {
                  const a = ASSETS[key];
                  return (
                    <tbody key={key}>
                      <tr style={{ borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                        <td style={{ padding: "8px 4px" }}>
                          <span style={{ marginRight: 6 }}>{a.icon}</span>
                          {a.label} alone
                        </td>
                        <td style={{ textAlign: "right", padding: "8px 4px" }}>{c.alone.structuresLost}</td>
                        <td style={{ textAlign: "right", padding: "8px 4px" }}>{fmt(c.alone.damages)}</td>
                        <td style={{ textAlign: "right", padding: "8px 4px", fontWeight: 500 }}>{fmt(c.alone.totalSeasonCost)}</td>
                        <td style={{ textAlign: "right", padding: "8px 4px", color: "var(--color-text-tertiary)" }}>—</td>
                      </tr>
                      <tr>
                        <td style={{ padding: "8px 4px", color: "#3C3489" }}>
                          <span style={{ marginRight: 6 }}>+🏠</span>
                          {a.label} + Firedome
                        </td>
                        <td style={{ textAlign: "right", padding: "8px 4px", color: "#3C3489" }}>{c.withFiredome.structuresLost}</td>
                        <td style={{ textAlign: "right", padding: "8px 4px", color: "#3C3489" }}>{fmt(c.withFiredome.damages)}</td>
                        <td style={{ textAlign: "right", padding: "8px 4px", fontWeight: 500, color: "#3C3489" }}>{fmt(c.withFiredome.totalSeasonCost)}</td>
                        <td style={{ textAlign: "right", padding: "8px 4px", fontWeight: 500, color: c.delta > 0 ? "#0F6E56" : "#A32D2D" }}>
                          {c.delta > 0 ? "−" : "+"}{fmt(Math.abs(c.delta))}
                        </td>
                      </tr>
                    </tbody>
                  );
                })}
            </table>
            <div style={{ fontSize: 11, color: "var(--color-text-tertiary)", marginTop: 10, lineHeight: 1.5 }}>
              A green delta means Firedome's structure protection saves more than its lease cost. Red means the structures-saved value is below the lease — usually because there were few structures lost in the base scenario or the site has low structure density (wine farms).
            </div>
          </div>

          <div style={{ marginTop: 14, fontSize: 11, color: "var(--color-text-tertiary)", lineHeight: 1.6 }}>
            Damages count only high-value land + structures, not raw hectares. Land value varies by site: residential community $50K/ha (20% high-value), wine farm $180K/ha (65% high-value), ski resort $95K/ha (45% high-value). Structures at $600K each. Seasonal lease = 5-month operating lease (May–Sep). Firedome: $10K/month per coverage unit (305 m radius / ~29 ha). Wind ceilings: aircraft 30 mph, drones 30 mph, trucks degrade above 30 mph but operate, Firedome unaffected. Indicative only — not for operational planning.
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FirefightingSim />);
</script>
</body>
</html>
